services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: huongnghiep
      POSTGRES_USER: huongnghiep
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huongnghiep -d huongnghiep"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
