server:
  port: ${APP_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/huongnghiep}
    username: ${SPRING_DATASOURCE_USERNAME:huongnghiep}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
app:
  frontend-origin: ${APP_ORIGIN:http://localhost:5173}
  seed-enabled: ${SEED_ENABLED:false}
  bootstrap-admin-subject: ${BOOTSTRAP_ADMIN_GOOGLE_SUB:}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-client-secret: ${GOOGLE_CLIENT_SECRET:}
